<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>タイピング</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: flash 0.2s infinite;
      cursor: pointer;
      flex-direction: column;
      gap: 10px;
    }

    @keyframes flash {
      0%   { background: red; }
      25%  { background: blue; }
      50%  { background: yellow; }
      75%  { background: green; }
      100% { background: red; }
    }

    #box {
      position: absolute;
      width: 80px;
      height: 80px;
      background: white;
    }

    input {
      z-index: 10;
      padding: 10px;
      font-size: 1rem;
      width: 80%;
      max-width: 500px;
    }

    #stopNotice {
      z-index: 10;
      font-size: 1.2rem;
      font-weight: bold;
      color: white;
      text-shadow: 2px 2px 4px black;
    }

    #marquee {
      position: absolute;
      bottom: 10px;
      white-space: nowrap;
      font-size: 2rem;
      font-weight: bold;
      color: white;
      animation: scroll 0.8s linear infinite;
    }

    @keyframes scroll {
      0%   { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    /* ★ブラックアウト用レイヤー */
    #blackout {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: black;
      display: none;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <audio id="player" src="o.wav" loop></audio>

  <input id="stopInput" placeholder="停止コードを入力" onpaste="return false">

  <div id="stopNotice">止めたければ以下の文字を正確に入力：朝に豆腐食べたら家壊れたと思ったらハリボテだったと思ったら本当に壊れてた</div>

  <div id="box"></div>

  <div id="marquee">これはとてもうるさいページです！！</div>

  <!-- ★ブラックアウト画面 -->
  <div id="blackout"></div>

  <script>
    const audio = document.getElementById('player');
    const stopInput = document.getElementById('stopInput');
    const box = document.getElementById('box');
    const blackout = document.getElementById('blackout');

    const STOP_WORD = "朝に豆腐食べたら家壊れたと思ったらハリボテだったと思ったら本当に壊れてた";

    document.body.addEventListener('click', (event) => {
      if (event.target === stopInput) return;
      audio.play().catch(err => console.log(err));
    });

    stopInput.addEventListener('input', () => {
      if (stopInput.value === STOP_WORD) {
        audio.pause();
        blackout.style.display = "block";  // ★ブラックアウト発動
      }
    });

    function moveBox() {
      const x = Math.random() * window.innerWidth;
      const y = Math.random() * window.innerHeight;
      box.style.transform = `translate(${x}px, ${y}px)`;
    }

    setInterval(moveBox, 50);
  </script>
</body>
</html>
